name: weekly-rental-search

on:
  schedule:
    - cron: "0 1 * * 6"   # 每週六 09:00（台灣時間）
  workflow_dispatch: {}     # 也可以在 GitHub 上手動按一下執行

permissions:
  contents: write           # 需要把 data/seen.json 存回 repo，避免重複推薦

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save seen listings
        run: |
          git config user.name "rental-bot"
          git config user.email "rental-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update seen listings" && git push
