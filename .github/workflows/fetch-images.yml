name: fetch-images

on:
  workflow_dispatch:
    inputs:
      url:
        description: "建案官網或圖庫網址"
        required: true
      name:
        description: "資料夾名稱，例如 shanghe"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download page images
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
        run: |
          mkdir -p images/$NAME
          curl -sL -A "Mozilla/5.0" "$URL" -o images/$NAME/page.html
          python3 - <<'PY'
          import os,re,urllib.parse,urllib.request
          n=os.environ["NAME"]; base=os.environ["URL"]
          h=open(f"images/{n}/page.html",encoding="utf-8",errors="ignore").read()
          urls=sorted(set(urllib.parse.urljoin(base,u) for u in re.findall(r'https?://[^"\'\s,]+\.(?:jpe?g|png|webp)',h,re.I)))
          urls=[u for u in urls if not re.search(r'-\d+x\d+\.',u)]
          urls.sort(key=lambda u:(0 if re.search(r'配|1F|plan|site',urllib.parse.unquote(u),re.I) else 1,u))
          open(f"images/{n}/urls.txt","w").write("\n".join(urls))
          for i,u in enumerate(urls[:40]):
              try:
                  req=urllib.request.Request(urllib.parse.quote(u,safe=":/%?=&"),headers={"User-Agent":"Mozilla/5.0"})
                  d=urllib.request.urlopen(req,timeout=20).read()
                  if len(d)>20000: open(f"images/{n}/{i:02d}_{os.path.basename(u)[:60]}","wb").write(d)
              except Exception as e: print("skip",u,e)
          PY
      - name: Push to image-dumps branch
        run: |
          git config user.name "rental-bot"
          git config user.email "rental-bot@users.noreply.github.com"
          git checkout -B image-dumps
          git add -f images/
          git commit -m "images"
          git push -f origin image-dumps
