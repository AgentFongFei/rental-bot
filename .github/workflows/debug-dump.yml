name: debug-dump

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python debug_dump.py debug
      - name: Push dumps to the debug-dumps branch
        run: |
          git config user.name "rental-bot"
          git config user.email "rental-bot@users.noreply.github.com"
          git checkout -B debug-dumps
          git add -f debug/
          git commit -m "591 page dumps"
          git push -f origin debug-dumps
